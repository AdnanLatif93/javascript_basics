<!DOCTYPE html>
<html>

<head>
  <title>Lesson 7: Function (Exercises)</title>
</head>

<body>
  <p>Lesson 07e: Function-Excercises</p>
  <p id="displayText"></p>
  <script>
    // create a function 'convert To Celsius (Fahrenheit)' That takes a number in degree fahrenheit and return a number in degree celsius.
    // Formula:
    // Calsius = (fahrenheit - 32) * 5/9
    // convert to Celsius (86) ==> 30.


    function convertToCelsius(fahrenheit) {
      const celsius = (fahrenheit -32) * 5/9;
      document.getElementById('displayText').innerHTML = `the celsius is ${celsius} of ${fahrenheit} fahrenheit`;
      return fahrenheit;
    }

    console.log(convertToCelsius(86));
  </script>
</body>

</html>
