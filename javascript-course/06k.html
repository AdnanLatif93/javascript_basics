<!DOCTYPE html>
<html>

<head>
  <title>Cart Quantity</title>
</head>

<body>
  <button onclick="
      console.log(`Cart quantity: ${cartQuantity}`);
    ">Show Quantity</button>

  <button onclick="
      cartQuantity < 10 ? cartQuantity++ : alert('cart is full!');
      cartQuantity <= 10 && console.log(`Cart quantity: ${cartQuantity}`);
    ">Add to Cart</button>

  <button onclick="
      cartQuantity < 10 ? cartQuantity += 2 : alert('cart is full!');
      cartQuantity <= 10 && console.log(`Cart quantity: ${cartQuantity}`);
    ">+2</button>

  <button onclick="
      cartQuantity < 10 ? cartQuantity = cartQuantity + 3 : alert('cart is full!');
      cartQuantity <= 10 && console.log(`Cart quantity: ${cartQuantity}`);
    ">+3</button>

  <button onclick="
      cartQuantity < 10 ? cartQuantity += 4 : alert('cart is full!');
      cartQuantity <= 10 && console.log(`Cart quantity: ${cartQuantity}`);
    ">+4</button>

  <button onclick="
      cartQuantity < 10 ? cartQuantity += 5 : alert('cart is full!');
      cartQuantity <= 10 && console.log(`Cart quantity: ${cartQuantity}`);
    ">+5</button>

  <!-- vvv This code was changed. vvv -->
  <button onclick="
    if(0 > cartQuantity - 1){
      alert('Not enough items in the cart');
    }else {
      cartQuantity--;
      console.log(`Cart quantity: ${cartQuantity}`);
    }
      ">Remove from cart</button>

  <button onclick="
      if(0 > cartQuantity - 2){
        alert('Not enough items in the cart')
      }else{
        cartQuantity -= 2;
        console.log(`Cart quantity: ${cartQuantity}`);
      }
    ">-2</button>

  <button onclick="
    if(0 > cartQuantity - 3){
      alert('Not enough items in the cart')
    }else{
      cartQuantity -= 3;
      console.log(`Cart quantity: ${cartQuantity}`);
    }
    ">-3</button>
  <!-- ^^^ This code was changed. ^^^ -->

  <button onclick="
      cartQuantity = 0;
      console.log('Cart was reset.');
      console.log(`Cart quantity: ${cartQuantity}`);
    ">Reset Cart</button>

  <script>
    let cartQuantity = 0;
  </script>
</body>

</html>
