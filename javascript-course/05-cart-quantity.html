<!DOCTYPE html>
<html>

<head>
  <title>Cart Quantity</title>
</head>

<body>
  <p>Cart Quantity: <span id="quantity"></span></p>
  <button onclick="console.log(`Cart Quantity: ${cartQuantity}`); showQuantity();">Show Quantity</button>
  <button onclick="console.log(`Cart Quantity: ${cartQuantity + 1}`); cartQuantity++; showQuantity();">Add to Cart</button>
  <button onclick="console.log(`Cart Quantity: ${cartQuantity + 2}`); cartQuantity += 2; showQuantity();">+2</button>
  <button onclick="console.log(`Cart Quantity: ${cartQuantity + 3}`); cartQuantity += 3; showQuantity();">+3</button>
  <button onclick="console.log(`cart Quantity: ${cartQuantity + 4}`); cartQuantity += 4; showQuantity();">+4</button>
  <button onclick="console.log(`cart Quantity: ${cartQuantity + 5}`); cartQuantity += 5; showQuantity();">+5</button>
  <button onclick="console.log(`Cart Quantity: ${cartQuantity - 1}`); cartQuantity--; showQuantity();">Remove from Cart</button>
  <button onclick="console.log(`Cart Quantity: ${cartQuantity - 2}`); cartQuantity -= 2; showQuantity();">-2</button>
  <button onclick="console.log(`Cart Quantity: ${cartQuantity - 3}`); cartQuantity -= 3; showQuantity();">-3</button>
  

  <button onclick="
  console.log('Cart was reset.');
  console.log(`Cart Quantity: ${cartQuantity = 0}`); cartQuantity = 0; showQuantity();"
  >Reset Cart</button>
  <script>
    let cartQuantity = 0;

    function showQuantity() {
      document.getElementById("quantity").textContent = cartQuantity;
    }
  </script>
</body>

</html>
