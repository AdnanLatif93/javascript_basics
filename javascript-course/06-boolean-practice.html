  <script>
    // Level 1. &&, ||

    console.log(true && true); // true.
    console.log(false && false); // false.
    console.log(true && false); // false.

    console.log(false || true); // true.
    console.log(false || false); // false.
    console.log(true || false); // true.

    console.log(true && true && false); // false.
    console.log(false || true || false); // true.
    console.log(true && false || true); // true.
    console.log(false || false && true); // false.

    //--------------------------------------------------------------------------------------------------------------------------------------

    // Level 2. Comparision <=, >=, &&, ||

    console.log(20 >= 18); // true.
    console.log(15 >= 18); //false.
    console.log(20 >= 18 && 20 <= 30); // true.
    console.log(35 >= 18 && 35 <= 30); //false.
    console.log(35 <= 10 || 35 >= 30); // true.
    console.log(20 <= 10 || 20 >= 30); // false.
    console.log(5 <= 6 || 5 >= 65); // true.
    console.log(50 <= 6 || 50 >= 65); // false.

    //--------------------------------------------------------------------------------------------------------------------------------------

    console.log('miles' === 'miles' && 'miles'  === 'km' && 'miles' === 'ft'); // false.
    console.log('lbs' !== 'miles' || 'lbs' !== 'km' || 'lbs' != 'ft'); // true

    {

    {

    {

    {
