<!DOCTYPE html>

<head>
  <title>Lesson 7: Function (Exercises)</title>
</head>

<body>
  <p id="displayText"></p>
  <script>
    function greet(name) {
      if (!name) {
        console.log('Hi There!')
      } else {
        console.log(`Hello' ${name}!`);
      }
    }
    greet('Adnan');
    greet('Daniyal');
    greet();
  </script>
</body>
