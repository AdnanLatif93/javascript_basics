<!Doctype html>
<html>

<head>
  <title>Rock Papper Scissors</title>
</head>

<body>
  <p>Lesson 9: TuTORIAL: (Objects) Rock Papper Scissors</p>
  <p>
    <Button onclick="playGame('rock');">
      Rock
    </Button>
    <Button onclick="playGame('papper');">
      Papper
    </Button>
    <Button onclick="playGame('scissors');">
      Scissors
    </Button>
    <Button onclick="resetScore();">Reset Score</Button>
    <span>
      <br><br>
      Scores:&nbsp;&nbsp;
      Win:&nbsp;<span id="winResult">0</span>&nbsp;
      Loose:&nbsp;<span id="looseResult">0</span>&nbsp;
      Tie:&nbsp;<span id="tieResult">0</span>&nbsp;
    </span>
  </p>
  <script>
    // create an object to store the calculation.
    const score = JSON.parse(localStorage.getItem('score'))
    
    function playGame(yourMove) {
      const computerMove = pickComputerMoves();
      let result = '';
      if (yourMove === 'rock') {
        if (computerMove === 'rock') {
          result = 'Tie!';
        } else if (computerMove === 'papper') {
          result = 'You Win!';
        } else if (computerMove === 'scissors') {
          result = 'You Loose!';
        }
      } else if (yourMove === 'papper') {
        if (computerMove === 'rock') {
          result = 'You Win!';
        } else if (computerMove === 'papper') {
          result = 'Tie!';
        } else if (computerMove === 'scissors') {
          result = 'You Loose!';
        }
      } else if (yourMove === 'scissors') {
        if (computerMove === 'rock') {
          result = 'You Loose!';
        } else if (computerMove === 'papper') {
          result = 'You Win!';
        } else if (computerMove === 'scissors') {
          result = 'Tie!';
        }
      }

      if (result === 'You Win!') {
        score.wins += 1;
        document.getElementById('winResult').innerHTML = `${score.wins}`;
      } else if (result === 'You Loose!') {
        score.losses += 1;
        document.getElementById('looseResult').innerHTML = `${score.losses}`;
      } else if (result === 'Tie!') {
        score.ties += 1;
        document.getElementById('tieResult').innerHTML = `${score.ties}`;
      }

      localStorage.setItem('score', JSON.stringify(score));

      let message =
        `you picked ${yourMove}. computer picked ${computerMove}. ${result}
         Win : ${score.wins}, Loose: ${score.losses}, Tie: ${score.ties}`;
      alert(`${message}`);
    }
    function pickComputerMoves() {
      let randomNumber = null;
      let computerMove = '';
      randomNumber = Math.random();
      if (randomNumber >= 0 && randomNumber < 1 / 3) {
        computerMove = 'rock';
      } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
        computerMove = 'papper';
      } else if (randomNumber >= 2 / 3 && randomNumber <= 1) {
        computerMove = 'scissors';
      }
      return computerMove;
    }
    function resetScore() {
      score.wins = 0; document.getElementById('winResult').innerHTML = 0;
      score.losses = 0; document.getElementById('looseResult').innerHTML = 0;
      score.ties = 0; document.getElementById('tieResult').innerHTML = 0;
    }
  </script>
</body>

</html
