<!DOCTYPE html>
<html>

<head>
  <title>Cart Quantity</title>
</head>

<body>
  <button onclick="
      console.log(`Cart quantity: ${cartQuantity}`);
    ">Show Quantity</button>

  <button onclick="updateCalculation(1)">Add to Cart</button>

  <button onclick="updateCalculation(2)">+2</button>

  <button onclick="updateCalculation(3)">+3</button>

  <button onclick="updateCalculation(4)">+4</button>

  <button onclick="updateCalculation(5)">+5</button>

  <!-- vvv This code was changed. vvv -->
  <button onclick="updateCalculation(-1)">Remove from cart</button>

  <button onclick="updateCalculation(-2)">-2</button>

  <button onclick="updateCalculation(-3)">-3</button>
  <!-- ^^^ This code was changed. ^^^ -->

  <button onclick="
      cartQuantity = 0;
      console.log('Cart was reset.');
      console.log(`Cart quantity: ${cartQuantity}`);
    ">Reset Cart</button>

  <script>
    /* 
      Create a copy of the Cart Quantity project from excercise 6l.
      Create a function 'updateCartQuantity' and reuse the code.
    */

    let cartQuantity = 0;

    function updateCalculation(value) {
      if (cartQuantity + value > 10) {
        console.log(`The Cart is full!`);
      } else if (cartQuantity + value < 0) {
        console.log(`Not enough items in the cart!`);
      } else {
        cartQuantity = cartQuantity + value;
        console.log(cartQuantity)
      }


    }
  </script>
</body>

</html>
