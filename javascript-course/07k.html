<!DOCTYPE html>
<html>

<head>
  <title>Cart Quantity</title>
</head>

<body>
  <button onclick="
      console.log(`Cart quantity: ${cartQuantity}`);
    ">Show Quantity</button>

  <button onclick="updateCartQuanity(1)">Add to Cart</button>

  <button onclick="updateCartQuanity(2)">+2</button>

  <button onclick="updateCartQuanity(3)">+3</button>

  <button onclick="updateCartQuanity(4)">+4</button>

  <button onclick="updateCartQuanity(5)">+5</button>

  <!-- vvv This code was changed. vvv -->
  <button onclick="updateCartQuanity(-1)">Remove from cart</button>

  <button onclick="updateCartQuanity(-2)">-2</button>

  <button onclick="updateCartQuanity(-3)">-3</button>
  <!-- ^^^ This code was changed. ^^^ -->

  <button onclick="
      cartQuantity = 0;
      console.log('Cart was reset.');
      console.log(`Cart quantity: ${cartQuantity}`);
    ">Reset Cart</button>

  <script>
    /* 
      Create a copy of the Cart Quantity project from excercise 6l.
      Create a function 'updateCartQuantity' and reuse the code.
    */

    let cartQuantity = 0;

    function updateCartQuanity(value) {
      if (cartQuantity + value > 10) {
        alert(`The Cart is full!`);
        return; // this empty return send 'undefined' as a value back to the function call. And the function ends immediately here.
      } else if (cartQuantity + value < 0) {
        alert(`Not enough items in the cart!`);
        return; // this empty return send 'undefined' as a value back to the function call. And the function ends immediately here.
      } else {
        cartQuantity = cartQuantity + value;
        console.log(cartQuantity)
      }


    }
  </script>
</body>

</html>
